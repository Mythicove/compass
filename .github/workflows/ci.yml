name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  create:
    # 只在打 tag 时出包（见 package 作业的 if）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Tauri 在 Linux 上编译时需要 WebKitGTK 与相关开发包（reqwest 用 rustls，故不需要 OpenSSL）
      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 版本取自 package.json 的 packageManager 字段（单一来源）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: typecheck
        run: pnpm typecheck

      - name: build frontend
        run: pnpm build

  # 真下载冒烟：装一个真实的 1.21.4（约 550MB），再断言"装出来的东西与我们拼的命令行自洽"
  # （classpath 每一项都在磁盘上、资源对象数量与索引一致、日志配置在预期位置）。
  # 只在 main 与手动触发时跑：一次要下几百 MB，不该让每个 PR 都付这个钱。
  smoke:
    name: install smoke (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # NeoForge 的 processor pipeline 要用 Java 跑（installertools / jarsplitter /
      # AutoRenamingTool / binarypatcher），1.21.4 这一代要 Java 21。
      # 固定装上，不依赖 runner 预装的是哪个版本。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: install a real version and check the launch plan
        working-directory: src-tauri
        # COMPASS_SMOKE_LAUNCH 不设：runner 没有显示环境，只验"装得对 + 命令行自洽"。
        # 真的拉起游戏由人工验收清单覆盖（计划文档 P1 验收）。
        #
        # 不加 --release：`[profile.release] panic = "abort"` 与测试需要的 unwind 会在
        # 同一个 target 目录里打架（本地实测："the crate compass_lib requires panic
        # strategy abort which is incompatible with this crate's strategy of unwind"）。
        # 这两个测试是 I/O 密集（下载 + 跑 Java 子进程），release 买不到可测的速度：
        # 本地 debug 45.0s、release 52.0s。
        run: cargo test --test install_smoke -- --ignored --nocapture

      - name: install a real NeoForge version (processor pipeline)
        working-directory: src-tauri
        # 这一步要跑 6 个 Java 子进程（切分/改名/打补丁），对路径分隔符与 java
        # 可执行文件名敏感，所以必须三平台都跑：只在 Windows 上验过不算验过。
        #
        # 按名字只跑安装那个：同文件里的 launches_neoforge_for_real 要真启动游戏，
        # 而 runner 没有显示服务，GLFW 建窗就炸，走不到我们要的标记行；它还要再
        # 下一次 ~700MB。真启动是本地验收（需要一台有显示的机器），CI 覆盖到
        # "装得出来 + 启动计划自洽"为止。
        #
        # 数据目录与下面的 Forge 步骤共用：两者都是 1.21.4，原版库与资源可以复用，
        # 省掉一整套 ~350MB 的重复下载（真实启动器本来也是一个数据目录装多个版本）。
        env:
          COMPASS_NEOFORGE_DIR: ${{ runner.temp }}/compass-live
        run: cargo test --test neoforge_live -- --ignored --nocapture installs_neoforge_for_real

      - name: install a real Forge version (bundled artifacts, no module path)
        working-directory: src-tauri
        # Forge 与 NeoForge 不是一套东西，不能靠"NeoForge 通了"推过来（都是实测差异）：
        # - 版本号是 `<游戏版本>-<forge版本>`，1.12.2 那批的 loader 段有**四**位数字；
        # - 版本 JSON 里每个版本都恰好有一条 `"url": ""` 的库，产物在 installer 的
        #   maven/ 树里或由 processor 生成，不是下载来的；
        # - 1.21.4 把打过补丁的 `:client` **列进了** classpath（NeoForge 一个游戏 jar
        #   都不列），而它的 jvm 参数里没有模块路径，所以不存在自动模块名撞车。
        #
        # 只跑现代版本：另外三套格式各自要再下一整套旧资源（1.12.2 ~1GB、
        # 1.16.5 ~700MB、1.8.9 ~1GB），而它们独有的路径都已有离线测试钉住——
        # 从 installer 的 maven/ 树取产物见 installer_maven_tree_is_extracted_into_libraries，
        # v0 的内联 versionInfo 与 universal 拷贝见 v0_profiles_carry_the_version_json_inline
        # 与 legacy_universal_jar_is_copied_to_its_maven_path；五份真 profile
        # （1.21.4 / 1.16.5 / 1.12.2 / 1.8.9 / 1.7.10）都是未裁剪的原文。
        # 四套格式的真装在本地都跑过（tests/forge_live.rs 的四个测试），只是不进 CI。
        env:
          COMPASS_FORGE_DIR: ${{ runner.temp }}/compass-live
        run: cargo test --test forge_live -- --ignored --nocapture installs_modern_forge_for_real

      - name: install a real Modrinth modpack (.mrpack)
        working-directory: src-tauri
        # 用仓库里那份真包（Fabulously Optimized 8.2.0 / 1.21.4，183KB），不是造出来的样本：
        # 造出来的包只会验到"我以为的格式"。这一步覆盖整合包独有的三件事——
        # 按 env.client 取舍文件、overrides/ 与 client-overrides/ 落进游戏目录、
        # 按 dependencies 先装游戏版本与 loader 再建实例。
        #
        # 共用上面两步的数据目录：1.21.4 的原版库与资源已经在了，这一步只多下
        # ~42MB 的 mod，所以三平台都跑得起。
        # 失败回滚那条（a_failed_modpack_install_leaves_no_instance_behind）也一起跑：
        # 它要联网装父版本，但装不了的是 loader 版本，代价很小。
        env:
          COMPASS_MODPACK_DIR: ${{ runner.temp }}/compass-live
        run: cargo test --test modpack_live -- --ignored --nocapture

  package:
    name: package (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'create' && github.event.ref_type == 'tag')
    needs: check
    permissions:
      # tauri-action 需要写权限来创建 draft release
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            # Windows 暂不签名：SmartScreen 会提示"未知发布者"，安装文档里说明。
            # 后续若拿到 SignPath 的开源项目证书，在这里补 signCommand 即可。
            args: ""
          - platform: macos-latest
            # 签名与公证需要 APPLE_CERTIFICATE / APPLE_ID / APPLE_TEAM_ID 等 secrets，
            # 配好后 tauri-action 自动签名+公证；未配置时产出未签名 dmg。
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 版本取自 package.json 的 packageManager 字段（单一来源）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tag 触发出正式包；手动触发（workflow_dispatch）出 dev 包供人工验收，
      # 两种情况都必须有一个 tagName，否则 tauri-action 建不出 release。
      - id: tagname
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "create" ]; then
            echo "tag=${{ github.event.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tagname.outputs.tag }}
          releaseName: "Mythic Compass __VERSION__"
          releaseBody: "由 CI 产出的三平台安装包（Windows 未签名，见安装文档）。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
